<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — {{ organization_name }}</title>
</head>
<body style="margin:0;padding:0;background:#FFEFF1;color:#1A1A1A;font-family:Poppins,Arial,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFEFF1">
  <tr>
    <td align="center" style="padding:40px 20px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#FFD9DE;border-radius:16px;overflow:hidden">
        <tr>
          <td align="center" style="padding:30px 24px 20px;background:#FFD9DE">
            <img src="{{ logo_url }}" alt="DIGI HR" width="160" style="display:block;height:auto;max-width:160px;border:0">
          </td>
        </tr>
        <tr>
          <td style="padding:8px 28px 32px;color:#1A1A1A">
            <h1 style="margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-0.02em;color:#1A1A1A;text-align:center">Reset your password</h1>
            <p style="margin:0 0 24px;font-size:15px;color:#626262;line-height:1.6;text-align:center">
              You requested a password reset for your <strong style="color:#1A1A1A">{{ organization_name }}</strong> account on DIGI HR.
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding:12px 0 8px">
                  <a href="{{ reset_link }}" style="display:inline-block;min-width:240px;min-height:50px;background:#FFA6B5;color:#222222;border-radius:8px;font-weight:600;font-size:16px;line-height:50px;text-align:center;text-decoration:none;padding:0 24px">Reset password</a>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0;font-size:13px;color:#626262;line-height:1.6;text-align:center">
              This link expires after 72 hours and can be used once.<br>
              If you did not request this, you can ignore this email and your password will stay unchanged.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px;color:#8A6A70;font-size:12px;border-top:1px solid #F5C2CA;background:#FFEFF1">
            Powered by Digi02
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
