<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — {{ organization_name }}</title>
</head>
<body style="margin:0;padding:0;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.6">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000">
  <tr>
    <td align="center" style="padding:40px 20px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#0A0A0A;border:1px solid #1A1A1A;border-radius:12px;overflow:hidden">
        <tr>
          <td align="center" style="padding:32px 24px 24px;background:#000;border-bottom:1px solid #1A1A1A">
          </td>
        </tr>
        <tr>
          <td style="padding:32px 24px;color:#fff">
            <h1 style="margin:0 0 8px;font-size:28px;font-weight:800;letter-spacing:-0.02em;color:#fff">Reset your password</h1>
            <p style="margin:0 0 24px;font-size:16px;color:rgba(255,255,255,0.7);line-height:1.6">
              You requested a password reset for your {{ organization_name }} account on DIGI HR.
            </p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding:16px 0">
                  <a href="{{ reset_link }}" style="display:inline-block;width:100%;max-width:260px;min-height:52px;background:#0E4DA4;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:17px;text-align:center;text-decoration:none;padding:0 16px">Reset password</a>
                </td>
              </tr>
            </table>
            <p style="margin:24px 0 0;font-size:14px;color:rgba(255,255,255,0.5);line-height:1.6">
              This link expires after 72 hours and can be used once.<br>
              If you did not request this, you can ignore this email and your password will stay unchanged.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px;color:rgba(255,255,255,0.4);font-size:13px;border-top:1px solid #1A1A1A;background:#050505">
            Powered by DIGI
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
