<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We received your request — DIGI HR</title>
</head>
<body style="margin:0;padding:0;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.6">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#000">
  <tr>
    <td align="center" style="padding:40px 20px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#0A0A0A;border:1px solid #1A1A1A;border-radius:12px;overflow:hidden">
        <tr>
          <td style="padding:32px 24px;color:#fff">
            <h1 style="margin:0 0 8px;font-size:28px;font-weight:800;letter-spacing:-0.02em;color:#fff">We received your request</h1>
            <p style="margin:0 0 20px;font-size:16px;color:rgba(255,255,255,0.7);line-height:1.6">
              Hi {{ contact_name }}, thanks for requesting access for {{ company_name|default:"your company" }}.
            </p>
            <p style="margin:0 0 24px;font-size:14px;color:rgba(255,255,255,0.7);line-height:1.6">
              Our team will review your request and be in touch shortly. Once approved, you will receive an invite to set up your workspace.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px;color:rgba(255,255,255,0.4);font-size:13px;border-top:1px solid #1A1A1A;background:#050505">
            Powered by DIGI
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
