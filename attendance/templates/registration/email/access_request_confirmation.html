<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We received your request — DIGI HR</title>
</head>
<body style="margin:0;padding:0;background:#FFEFF1;color:#1A1A1A;font-family:Poppins,Arial,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFEFF1">
  <tr>
    <td align="center" style="padding:40px 20px">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#FFD9DE;border-radius:16px;overflow:hidden">
        <tr>
          <td align="center" style="padding:30px 24px 20px;background:#FFD9DE">
            <img src="{{ logo_url }}" alt="DIGI HR" width="160" style="display:block;height:auto;max-width:160px;border:0">
          </td>
        </tr>
        <tr>
          <td style="padding:8px 28px 32px;color:#1A1A1A">
            <h1 style="margin:0 0 8px;font-size:26px;font-weight:700;letter-spacing:-0.02em;color:#1A1A1A;text-align:center">We received your request</h1>
            <p style="margin:0 0 16px;font-size:15px;color:#626262;line-height:1.6;text-align:center">
              Hi {{ contact_name }}, thanks for requesting access for <strong style="color:#1A1A1A">{{ company_name|default:"your company" }}</strong>.
            </p>
            <p style="margin:0 0 8px;font-size:14px;color:#626262;line-height:1.6;text-align:center">
              Our team will review your request and be in touch shortly. Once approved, you will receive an invite to set up your workspace.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px;color:#8A6A70;font-size:12px;border-top:1px solid #F5C2CA;background:#FFEFF1">
            Powered by Digi02
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
