{% extends 'registration/base_auth.html' %}{% block c %}<h4>Forgot password?</h4><p class="text-muted">Enter your account email. If it exists, we will send a reset link.</p><form method="post">{% csrf_token %}{{ form.email.errors }}<label class="form-label">Email</label><input type="email" name="email" class="form-control mb-3" required autocomplete="email"><button class="btn-p" type="submit">Send reset link</button></form><p class="mt-3"><a href="{% url 'login' %}">Back to log in</a></p>{% endblock %}
