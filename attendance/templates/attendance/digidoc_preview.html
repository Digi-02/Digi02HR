<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ document.title }} | Preview</title><style>body{margin:0;padding:24px;background:#eef0f3;font:14px/1.4 Arial,sans-serif;color:#202124}.preview{max-width:1000px;margin:0 auto}.preview h1{font-size:18px;font-weight:600}.page{display:block;max-width:100%;height:auto;margin:18px auto;background:white;box-shadow:0 2px 12px #17202d24}.page-label{max-width:794px;margin:12px auto 0;color:#667085}@media(max-width:600px){body{padding:8px}}</style></head><body><main class="preview"><h1>{{ document.title|escape }}</h1>{% for page in pages %}<p class="page-label">Page {{ page.number }}</p><img class="page" src="data:image/png;base64,{{ page.data }}" alt="Rendered document page {{ page.number }}">{% endfor %}</main></body></html>
